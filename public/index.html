<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Manager's Portal</title>
<script>
/* Visible error report: shows problems on screen instead of a blank page (useful on phones). */
(function () {
  var box;
  function show(msg) {
    try {
      if (!box) {
        box = document.createElement('div');
        box.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:100000;background:#FFF3E0;color:#B71C1C;font:13px/1.4 Arial,sans-serif;padding:10px 12px;border-bottom:2px solid #C82620;word-break:break-word';
        (document.body || document.documentElement).appendChild(box);
      }
      box.innerHTML += '<div>' + String(msg).replace(/[<>&]/g, function (c) { return { '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]; }) + '</div>';
    } catch (e) {}
  }
  window.addEventListener('error', function (e) { show('Error: ' + (e.message || 'unknown') + (e.lineno ? ' (line ' + e.lineno + ')' : '')); });
  window.addEventListener('unhandledrejection', function (e) { show('Problem: ' + ((e.reason && e.reason.message) || e.reason)); });
  setTimeout(function () {
    var app = document.getElementById('app'); if ((!window.__SESSION && !document.getElementById('loginov')) || (app && !app.innerHTML.trim() && !document.getElementById('loginov'))) show('Still waiting for the portal to start. Screenshot this and send it to Claude.');
  }, 7000);
})();
/* Implements the claude.use(...) runtime the portal was written for, on top of /api/*.
   Loaded before the app. Shows a login screen first (outlet + PIN, or Director password). */
(function () {
  var SESSION = null, readyP = null;
  window.__SESSION = null;

  function api(path, body, opts) {
    opts = opts || {};
    var ctl = new AbortController(), tm = setTimeout(function () { ctl.abort(); }, 25000);
    return fetch(path, Object.assign({ method: body === undefined ? 'GET' : 'POST', credentials: 'same-origin', signal: ctl.signal },
      body === undefined ? {} : { headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }, opts))
      .then(function (r) { clearTimeout(tm); return r; }, function (e) { clearTimeout(tm); throw new Error(e && e.name === 'AbortError' ? 'The server took too long to answer. Try again.' : (e.message || 'Network problem')); })
      .then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (j) {
          if (r.status === 401 && path !== '/api/login') { SESSION = null; location.reload(); }
          if (!r.ok) { var e = new Error(j.error || ('Request failed (' + r.status + ')')); e.status = r.status; throw e; }
          return j;
        });
      });
  }

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  function loginUI(outlets) {
    return new Promise(function (resolve) {
      var d = document.createElement('div');
      d.id = 'loginov';
      d.style.cssText = 'position:fixed;inset:0;background:#FBF4F1;z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px;font-family:Arial,Helvetica,sans-serif';
      var mode = 'manager';
      function draw(msg) {
        d.innerHTML = '<div style="background:#fff;border:1px solid #EAD9D3;border-radius:14px;padding:22px;max-width:360px;width:100%;box-shadow:0 6px 24px rgba(200,38,32,.12)">' +
          '<div style="background:#C82620;color:#fff;border-radius:10px;padding:14px;text-align:center;font-family:Georgia,serif;font-size:22px;font-weight:bold;margin-bottom:16px">Manager\'s Portal</div>' +
          (msg ? '<div style="background:#FDECEA;color:#B71C1C;border-radius:8px;padding:10px;margin-bottom:12px;font-size:14px">' + esc(msg) + '</div>' : '') +
          (mode === 'manager'
            ? '<label style="font-size:13px;color:#755F5A">Outlet</label><select id="lo" style="width:100%;padding:13px;font-size:16px;margin:4px 0 12px;border:1px solid #D9C6BF;border-radius:8px">' +
              outlets.map(function (o) { return '<option>' + esc(o) + '</option>'; }).join('') + '</select>' +
              '<label style="font-size:13px;color:#755F5A">PIN</label><input id="lp" type="password" inputmode="numeric" autocomplete="current-password" style="width:100%;padding:13px;font-size:18px;margin:4px 0 14px;border:1px solid #D9C6BF;border-radius:8px;box-sizing:border-box">'
            : '<label style="font-size:13px;color:#755F5A">Director password</label><input id="lp" type="password" autocomplete="current-password" style="width:100%;padding:13px;font-size:16px;margin:4px 0 14px;border:1px solid #D9C6BF;border-radius:8px;box-sizing:border-box">') +
          '<button id="lgo" style="width:100%;padding:14px;font-size:17px;background:#C82620;color:#fff;border:0;border-radius:10px;font-weight:bold">Sign in</button>' +
          '<div style="text-align:center;margin-top:14px"><a href="#" id="lsw" style="color:#C82620;font-size:14px">' + (mode === 'manager' ? 'Director sign in' : 'Manager sign in') + '</a></div></div>';
        d.querySelector('#lsw').onclick = function (e) { e.preventDefault(); mode = mode === 'manager' ? 'director' : 'manager'; draw(); };
        var go = function () {
          var btn = d.querySelector('#lgo'); btn.disabled = true; btn.textContent = 'Signing in...';
          var body = mode === 'manager' ? { outlet: d.querySelector('#lo').value, pin: d.querySelector('#lp').value } : { password: d.querySelector('#lp').value };
          api('/api/login', body).then(function (r) { d.remove(); resolve(r); }).catch(function (e) { draw(e.message); });
        };
        d.querySelector('#lgo').onclick = go;
        d.querySelector('#lp').onkeydown = function (e) { if (e.key === 'Enter') go(); };
      }
      draw();
      document.body.appendChild(d);
    });
  }

  function signOutBtn() {
    var b = document.createElement('a');
    b.href = '#'; b.textContent = 'Sign out (' + (SESSION.role === 'director' ? 'Director' : SESSION.outlet) + ')';
    b.style.cssText = 'position:fixed;right:10px;bottom:6px;font:12px Arial;color:#755F5A;background:rgba(255,255,255,.85);padding:3px 8px;border-radius:10px;z-index:9999';
    b.onclick = function (e) { e.preventDefault(); api('/api/me?logout=1').then(function () { location.reload(); }); };
    document.body.appendChild(b);
  }

  function ready() {
    if (readyP) return readyP;
    readyP = fetch('/api/me', { credentials: 'same-origin' }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (x) { return x.ok ? x.j : loginUI(x.j.outlets || []); })
      .then(function (s) { SESSION = s; window.__SESSION = s; signOutBtn(); return s; })
      .catch(function (e) {
        var d = document.createElement('div');
        d.style.cssText = 'position:fixed;inset:0;background:#FBF4F1;z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px;font-family:Arial,Helvetica,sans-serif;text-align:center';
        d.innerHTML = '<div><div style="font:bold 20px Georgia,serif;color:#C82620;margin-bottom:10px">Manager\'s Portal</div><div style="color:#B71C1C;margin-bottom:14px">Could not reach the server. Check your internet and try again.</div><button onclick="location.reload()" style="padding:12px 22px;font-size:16px;background:#C82620;color:#fff;border:0;border-radius:10px">Retry</button></div>';
        document.body.appendChild(d);
        throw e;
      });
    return readyP;
  }

  function mkdoc(path) {
    return {
      get: function () { return api('/api/db', { op: 'get', path: path }).then(function (r) { return { exists: !!r.exists, data: function () { return r.data ? JSON.parse(JSON.stringify(r.data)) : undefined; } }; }); },
      set: function (d) { return api('/api/db', { op: 'set', path: path, data: d }); }
    };
  }
  function query(col, where) {
    return {
      where: function (f, op, v) { return query(col, where.concat([[f, v]])); },
      get: function () { return api('/api/db', { op: 'query', collection: col, where: where }).then(function (r) { return { docs: r.docs.map(function (x) { return { data: function () { return x; } }; }) }; }); }
    };
  }
  function fileToBlob(f) { return f; }

  var CAPS = {
    db: function () { return { doc: mkdoc, collection: function (c) { return query(c, []); } }; },
    assets: function () {
      return {
        upload: function (blob, o) {
          var type = (o && o.type) || blob.type || 'image/jpeg';
          return fetch('/api/upload', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': type }, body: fileToBlob(blob) })
            .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || 'Upload failed'); return { id: j.id }; }); });
        },
        delete: function () { return Promise.resolve(); }
      };
    },
    mcp: function () {
      return {
        callTool: function (server, tool, input) {
          if (tool !== 'send_message') return Promise.reject(new Error('Not supported'));
          return api('/api/send', { subject: input.subject, htmlBody: input.htmlBody, attachments: input.attachments || [] }).then(function () { return { payload: { id: '1' } }; });
        }
      };
    },
    downloads: function () {
      return {
        save: function (o) {
          var a = document.createElement('a'), u = URL.createObjectURL(o.data);
          a.href = u; a.download = o.filename; document.body.appendChild(a); a.click();
          setTimeout(function () { URL.revokeObjectURL(u); a.remove(); }, 1500);
          return Promise.resolve();
        }
      };
    },
    user: function () {
      return { me: function () { return Promise.resolve({ email: null, isOwner: SESSION.role === 'director', canEdit: false }); } };
    }
  };

  window.claude = {
    use: function (name) {
      return ready().then(function () { if (!CAPS[name]) throw new Error('Unknown capability ' + name); return CAPS[name](); });
    }
  };
})();

</script>

.add{width:100%;margin-top:4px}.sub{font-size:12px;color:#666;margin:2px 0 6px}

.ok{background:var(--g)}.short{background:var(--r)}.over{background:var(--o)}

.err{background:#ffebee;border-left:4px solid var(--r);padding:8px 10px;margin:6px 0;border-radius:4px;font-size:14px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:12px;background:#fff8e1;border-radius:8px;margin:10px 0}.chk input{width:24px;height:24px;margin-top:2px}
.hide{display:none!important}
.bar{padding-bottom:34px!important}.lg{height:38px;width:auto;margin-right:10px;border-radius:4px;vertical-align:middle;background:#C82620}.wm{display:inline-block;margin-right:10px;padding:4px 8px;border:2px solid #F2CFC8;border-radius:6px;font:800 15px Georgia,serif;letter-spacing:2px;color:#FBEFEB}header{align-items:center}header>div:first-child{display:flex;align-items:center}header>div:first-child>div{line-height:1.3}.wi{padding:10px 0;border-bottom:1px solid #eee}.ph{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;align-items:center}.pt{position:relative;display:inline-block}.pt img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid #ddd}.pt b{position:absolute;top:-6px;right:-6px;background:#c62828;color:#fff;border-radius:50%;width:20px;height:20px;text-align:center;line-height:20px;font-size:14px}.pa{display:inline-block;padding:9px 12px;border:1px dashed #999;border-radius:8px;font-size:14px;color:#444;cursor:pointer}.wb{display:flex;gap:6px;margin-top:6px}.wb button{flex:1;padding:11px;background:#e1e6f0;color:#222}.wb button.on.Y{background:#2e7d32;color:#fff}.wb button.on.N{background:#c62828;color:#fff}.wb button.on.A{background:#757575;color:#fff}.card>h3{cursor:default}select{width:100%;padding:11px 10px;font-size:16px;border:1px solid #c5ccd8;border-radius:8px;background:#fff}</style></head><body><div id="app"></div>

function brandAll(){var h=document.querySelector('#app header>div:first-child');if(!h||h.querySelector('.lg,.wm'))return;var inner=document.createElement('div');while(h.firstChild)inner.appendChild(h.firstChild);h.appendChild(inner);h.insertAdjacentHTML('afterbegin',brandEl())}
function sl(n){return String(n).replace(/[^A-Za-z0-9]+/g,'_')}
function dbErr(e){return (e&&(e.message||e.code))||String(e)}
async function init(){
 try{DB=await claude.use('db')}catch(e){DB=null}
 try{MCP=await claude.use('mcp')}catch(e){MCP=null}
 try{AS=await claude.use('assets')}catch(e){AS=null}
 try{DL=await claude.use('downloads')}catch(e){DL=null}
 CFG=JSON.parse(JSON.stringify(DEFAULTS));
 if(DB){try{var s=await DB.doc('config/main').get();if(s.exists){var c=s.data();if(c.directors)CFG.directors=c.directors;if(c.walk)CFG.walk=c.walk;if(c.closing)CFG.closing=c.closing;if(c.ck)CFG.ck=c.ck;if(c.logo)CFG.logo=c.logo;if(c.ops)CFG.ops=c.ops;if(c.req)CFG.req=c.req;if(c.outlets)Object.keys(c.outlets).forEach(function(k){CFG.outlets[k]=c.outlets[k]})}}catch(e){}}
 try{var U=await claude.use('user');if(U){var me=await U.me(),em=String(me.email||'').toLowerCase(),al=(CFG.directors||[]).concat(CFG.ops||[]).map(function(x){return String(x).toLowerCase()});PRIV=!!(me.isOwner||me.canEdit||(em&&al.indexOf(em)>=0))}}catch(e){PRIV=false}
 viewHome()}
function note(m,c){return '<div class="'+(c||'warn')+'">'+m+'</div>'}
function viewHome(msg){
 var mo=today().slice(0,7);
 $('#app').innerHTML='<header><div><b>Manager\'s Portal</b><br><small>FUSE</small></div>'+(PRIV?'<button class="sec" id="st" style="padding:8px 12px">Settings</button>':'')+'</header><div class="wrap">'+(msg||'')+(DB?'':note('Not signed in to claude.ai - entries cannot be saved or submitted. Open this page signed in.','err'))+
 '<div class="card open"><h3>Select outlet</h3><div class="body">'+pilotKeys().map(function(o){return '<button class="o" data-o="'+esc(o)+'" style="width:100%;margin-bottom:8px;font-size:18px;padding:16px">'+esc(o)+'</button>'}).join('')+'</div></div>'+
 (PRIV?'<div class="card open"><h3>Monthly Excel file</h3><div class="body"><div class="g2"><div><label>Outlet</label><select id="mo">'+pilotKeys().map(function(o){return '<option>'+esc(o)+'</option>'}).join('')+'</select></div><div><label>Month</label><input type="month" id="mm" value="'+mo+'"></div></div><button class="sec add" id="dl" style="margin-top:10px">Download month workbook</button><div id="dlmsg" class="sub"></div></div></div>':'')+'</div>';
 document.querySelectorAll('.o').forEach(function(b){b.onclick=function(){viewOutlet(b.dataset.o)}});

 (doc.depts||[]).forEach(function(d){var r='';(d.items||[]).forEach(function(it){if(it.na)return;var vr=it.variance;if(vr)nv++;r+='<tr><td style="padding:4px 8px;border-bottom:1px solid #eee">'+String(it.t).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})+'</td><td align="right" style="padding:4px 8px;border-bottom:1px solid #eee">'+it.usage+'</td><td align="right" style="padding:4px 8px;border-bottom:1px solid #eee">'+it.sold+'</td><td align="right" style="padding:4px 8px;border-bottom:1px solid #eee;'+(vr?'color:#c62828;font-weight:bold':'color:#2e7d32')+'">'+(vr===null||vr===undefined?'-':(vr===0?'0':fx(vr)))+'</td></tr>'});
  if(r)rows+='<tr><td colspan="4" style="padding:6px 8px;background:#f6ecea;font-weight:bold">'+String(d.sec).replace(/[&<>]/g,'')+'</td></tr>'+r});
 return '<div style="'+box+'"><b>Closing stock variance</b> - '+(nv?'<span style="color:#c62828"><b>'+nv+' item'+(nv===1?'':'s')+' with variance</b></span>':'<span style="color:#2e7d32"><b>no variance</b></span>')+'<table style="border-collapse:collapse;width:100%;margin-top:6px;font-size:13px"><tr style="background:#C82620;color:#fff"><th align="left" style="padding:5px 8px">Item</th><th align="right" style="padding:5px 8px">Usage</th><th align="right" style="padding:5px 8px">Sold</th><th align="right" style="padding:5px 8px">Variance</th></tr>'+rows+'</table><div style="color:#777;font-size:12px;margin-top:4px">Variance = Sold - Usage. Counted by '+String(doc.by||'').replace(/[&<>]/g,'')+'.</div></div>'}

function mkId(){return sl(INFO.outlet)+'_'+S.date}
async function finalise(){var b=$('#fin');b.disabled=true;save();S.dayName=DAYN[new Date(S.date+'T12:00:00').getDay()];FINAL=dsrCalc(S);MORN=null;
 if(DB){try{var m=await DB.doc('morning/'+mkId()).get();if(m.exists)MORN=Number(m.data().total)}catch(e){}}
 window.STK_HTML='';if(DB){try{var cs=await DB.doc('closing/'+mkId()).get();window.STK_HTML=stockHtml(cs.exists?cs.data():null,S.date)}catch(e){window.STK_HTML=''}try{window.STK_HTML+=await checksHtml(S.date)}catch(e){}}
 viewResult()}

function chkRow(l,st,c){return '<tr><td style="padding:4px 8px;border-bottom:1px solid #eee">'+l+'</td><td style="padding:4px 8px;border-bottom:1px solid #eee;color:'+c+';font-weight:bold">'+st+'</td></tr>'}
async function checksHtml(date){
 var o=INFO.outlet,rows='',G='#2e7d32',R='#c62828',A='#ef6c00',bad=[];
 var get=async function(p){try{var d=await DB.doc(p).get();return d.exists?d.data():null}catch(e){return null}};
 var w=await get('walk/'+sl(o)+'_'+date),k=await get('cklist/'+sl(o)+'_'+date),c=await get('closing/'+sl(o)+'_'+date),q=await get('req/'+sl(o)+'_'+nextDate(date));
 var lst=function(doc){var out=[];(doc.items||[]).forEach(function(it){if(it.a==='N')out.push(esc(it.t)+(it.note?' - <i>'+esc(it.note)+'</i>':''))});return out};
 [['Manager walk',w],['Closing checklist',k]].forEach(function(x){var d=x[1];if(!d){rows+=chkRow(x[0],'NOT DONE',R);return}var m=d.summary||{};rows+=chkRow(x[0],'Done by '+esc(d.by)+': '+m.yes+' Yes, '+m.no+' No, '+m.na+' N/A'+(m.photos?', '+m.photos+' photo'+(m.photos>1?'s':''):''),m.no?A:G);if(m.no)lst(d).forEach(function(t){bad.push(x[0]+': '+t)})});
 rows+=chkRow('Closing stock count',c?'Done by '+esc(c.by)+': '+((c.summary||{}).withVariance?(c.summary.withVariance+' item(s) with variance'):'no variance'):'NOT SUBMITTED',c?(((c.summary||{}).withVariance)?A:G):R);
 rows+=chkRow('Requisition for tomorrow',q?(q.status==='draft'?'Draft only - not sent':'Sent: '+q.count+' item(s)'):'Not sent',q&&q.status!=='draft'?G:A);
 return '<div style="margin-top:14px;font-size:14px"><b>Checks today</b><table style="border-collapse:collapse;width:100%;margin-top:6px;font-size:13px">'+rows+'</table>'+(bad.length?'<div style="margin-top:6px;font-size:13px;color:#c62828"><b>Items marked No:</b><br>'+bad.join('<br>')+'</div>':'')+'</div>'}
async function monthDocs(outlet,month){
 var q=await DB.collection('dsr').where('outlet','==',outlet).where('month','==',month).get();
 return q.docs.map(function(x){var v=x.data();return{date:v.date,d:v.d,revision:v.revision}})}
async function makeBook(outlet,month){
 var docs=await monthDocs(outlet,month);if(!docs.length)throw new Error('No submitted days for '+outlet+' in '+month);
 var wb=buildWorkbook(outlet,docs);return{wb:wb,docs:docs,name:'DSR '+outlet.toUpperCase()+' '+MON[+month.slice(5,7)-1]+' '+month.slice(0,4)+'.xlsx'}}
async function downloadMonth(outlet,month,el){
 try{if(!DB)throw new Error('Not signed in');var bk=await makeBook(outlet,month);
  if(!DL){el.innerHTML='Downloads are not available in this view.';return}
  var arr=XLSX.write(bk.wb,{type:'array',bookType:'xlsx'});
  await DL.save({filename:bk.name,data:new Blob([arr],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})});el.textContent='Saved '+bk.name}
 catch(e){el.textContent='Could not download: '+dbErr(e)}}
function R(a,b,cls){return '<tr class="'+(cls||'')+'"><td>'+a+'</td><td>'+b+'</td></tr>'}
function viewResult(){window.scrollTo(0,0);var r=FINAL,T=r.tot,st=r.status,txt=st==='OK'?'CASH OK':(st==='SHORT'?'CASH SHORT<br>Rs '+fmt(-r.diff):'CASH OVER<br>Rs '+fmt(r.diff));
 var warn=r.errors.map(function(e){return '<div class="err">⛔ '+esc(e)+'</div>'}).join('')+r.warnings.map(function(e){return '<div class="warn">⚠ '+esc(e)+'</div>'}).join('');
 var tb='<table class="s">'+R('Gross sales (w/o GST)',fmt(T.gross))+R('GST',fmt(T.gst))+R('Discount','- '+fmt(T.disc))+R('Sale return','- '+fmt(T.ret))+R('Entertainment','- '+fmt(T.ent))+R('Total net sales',fmt(T.tnet),'b')+(MORN!=null?R('Morning sales (reported at 6pm)',fmt(MORN))+R('Evening sales',fmt(T.tnet-MORN)):'')+
  R('Card',fmt(T.card))+R('Food Panda',fmt(T.fp))+R('UAN credit',fmt(T.uan))+R('PPL voucher',fmt(T.ppl))+R('Total credit sales',fmt(T.credit),'b')+R('Cash sales',fmt(T.cash),'b')+
  R('Supplier / local payments','- '+fmt(r.supplier))+R('Petty cash, advances & expenses','- '+fmt(r.pettyCashExpense))+R('Net cash expected',fmt(r.netCash),'b')+R('Cash in till',fmt(r.cashInTill),'b')+R('Excess / (Short)',(r.diff<0?'('+fmt(-r.diff)+')':fmt(r.diff)),'b')+'</table>';
 $('#app').innerHTML='<header><div><b>'+esc(INFO.outlet)+' - '+S.date+'</b><br><small>Review before submitting</small></div></header><div class="wrap"><div class="banner '+st.toLowerCase()+'">'+txt+'</div>'+warn+'<div class="card open"><div class="body">'+tb+'</div></div>'+
  '<label class="chk"><input type="checkbox" id="ck"><span>I have rechecked all figures against the POS closing report and cash count.</span></label><div id="msg"></div></div><div class="bar"><button class="sec" id="ed">← Edit</button><button id="sb" disabled>Submit &amp; email Directors</button></div>';
 $('#ed').onclick=function(){FINAL=null;viewForm();window.scrollTo(0,0)};
 $('#ck').onchange=function(){$('#sb').disabled=!(this.checked&&!r.errors.length&&DB)};
 $('#sb').onclick=submitDay}
async function submitDay(){
 var b=$('#sb'),msg=$('#msg');b.disabled=true;$('#ed').disabled=true;b.textContent='Saving...';
 var r=FINAL,rev=1,steps=[];
 try{
  var ex=await DB.doc('dsr/'+mkId()).get();if(ex.exists)rev=(ex.data().revision||1)+1;
  await DB.doc('dsr/'+mkId()).set({outlet:INFO.outlet,date:S.date,month:S.date.slice(0,7),revision:rev,submittedAt:new Date().toISOString(),summary:{tnet:r.tot.tnet,netCash:r.netCash,cashInTill:r.cashInTill,diff:r.diff,status:r.status},d:S});
  var mp={};(S.meters||[]).forEach(function(m){if(m.night!==''&&m.night!=null)mp[m.name]=m.night});
  if(Object.keys(mp).length){var cur={};try{var ms=await DB.doc('meters/'+sl(INFO.outlet)).get();if(ms.exists)cur=ms.data().map||{}}catch(e){}Object.keys(mp).forEach(function(k){cur[k]=mp[k]});await DB.doc('meters/'+sl(INFO.outlet)).set({map:cur})}
  try{localStorage.removeItem(key())}catch(e){}
 }catch(e){b.disabled=false;$('#ed').disabled=false;b.innerHTML='Submit &amp; email Directors';msg.innerHTML=note('Could not save: '+esc(dbErr(e))+'. Your entries are still on this phone - try again.','err');return}
 b.textContent='Emailing...';
 var res={saved:true,rev:rev,email:null,err:null};
 try{
  if(!MCP)throw new Error('Email is not available in this view (open the page signed in on claude.ai with Gmail connected).');
  var bk=await makeBook(INFO.outlet,S.date.slice(0,7));
  var b64=XLSX.write(bk.wb,{type:'base64',bookType:'xlsx'});
  var st=r.status==='OK'?'Cash OK':(r.status==='SHORT'?'CASH SHORT Rs '+fmt(-r.diff):'CASH OVER Rs '+fmt(r.diff));
  var subj=(rev>1?'REVISED - ':'')+'DSR '+INFO.outlet.toUpperCase()+' - '+S.date+' | Net Sales Rs '+fmt(r.tot.tnet)+' | '+st;
  var inp={to:CFG.directors,subject:subj,htmlBody:emailHtml(INFO.outlet,S,r,rev,'',MORN)};
  if(b64.length<900000)inp.attachments=[{content:b64,filename:bk.name,mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}];else res.err='Workbook too large to attach - sent without it.';
  await MCP.callTool('Gmail','send_message',inp);res.email=CFG.directors.length;
 }catch(e){res.err=(e&&e.code==='approval_required')?'Gmail needs your approval - tap Retry email.':dbErr(e)}
 viewDone(res)}
function viewDone(x){
 $('#app').innerHTML='<div class="login"><div style="font-size:54px">'+(x.email?'✅':'⚠️')+'</div><h2>'+(x.email?'Submitted':'Saved - email not sent')+'</h2><p>DSR for <b>'+esc(INFO.outlet)+'</b> '+esc(S.date)+(x.rev>1?' (revision '+x.rev+')':'')+' is saved.'+(x.email?' Emailed to '+x.email+' Director'+(x.email>1?'s':'')+'.':'')+'</p>'+(x.err?note(esc(x.err),'err'):'')+
  (x.email?'':'<button id="rt" style="width:100%;margin-bottom:8px">Retry email</button>')+(PRIV?'<button class="sec" id="dd" style="width:100%;margin-bottom:8px">Download month Excel</button>':'')+'<div id="dm" class="sub"></div><button id="nw" style="width:100%">Done</button></div>';
 $('#nw').onclick=function(){viewOutlet(INFO.outlet)};
 if($('#dd'))$('#dd').onclick=function(){downloadMonth(INFO.outlet,S.date.slice(0,7),$('#dm'))};
 if($('#rt'))$('#rt').onclick=async function(){var r=FINAL=dsrCalc(S);this.disabled=true;
  try{var bk=await makeBook(INFO.outlet,S.date.slice(0,7));var b64=XLSX.write(bk.wb,{type:'base64',bookType:'xlsx'});
   await MCP.callTool('Gmail','send_message',{to:CFG.directors,subject:(x.rev>1?'REVISED - ':'')+'DSR '+INFO.outlet.toUpperCase()+' - '+S.date,htmlBody:emailHtml(INFO.outlet,S,r,x.rev,'',MORN),attachments:[{content:b64,filename:bk.name,mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}]});
   viewDone({rev:x.rev,email:CFG.directors.length})}catch(e){this.disabled=false;$('#dm').textContent='Email failed: '+dbErr(e)}}}
try{new MutationObserver(brandAll).observe(document.getElementById('app'),{childList:true})}catch(e){}
init();
